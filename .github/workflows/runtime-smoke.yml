name: Runtime Smoke

on:
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify change
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${BEFORE_SHA}"
            head="${GITHUB_SHA}"
          fi

          if [[ -z "${base}" || -z "${head}" || "${base}" =~ ^0+$ ]]; then
            echo "Unable to determine a reliable diff; running the full check."
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git diff --name-only "${base}" "${head}" > changed-files.txt; then
            echo "Unable to inspect changed files; running the full check."
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected; running the full check."
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true
          while IFS= read -r file; do
            case "${file}" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done < changed-files.txt

          echo "Changed files:"
          sed 's/^/ - /' changed-files.txt
          echo "Documentation-only: ${docs_only}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"

  paper-26-2:
    name: Paper 26.2 build 121 startup
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: [self-hosted, Linux, X64, resource-heavy]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and build plugin
        run: mvn -B -ntp verify

      - name: Start Paper with EggEmAll Reloaded
        env:
          PAPER_VERSION: '26.2'
          PAPER_BUILD: '121'
          RUNTIME_VARIANT: 'without-papi'
        run: bash scripts/runtime-smoke.sh

  paper-1-21-7:
    name: Paper 1.21.7 build 32 startup
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: [self-hosted, Linux, X64, resource-heavy]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 25 build toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and build current plugin
        run: mvn -B -ntp verify

      - name: Set up Java 21 runtime
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Start Paper 1.21.7 without PlaceholderAPI
        env:
          PAPER_VERSION: '1.21.7'
          PAPER_BUILD: '32'
          RUNTIME_VARIANT: 'without-papi'
        run: bash scripts/runtime-smoke.sh

  paper-26-2-placeholderapi:
    name: Paper 26.2 + PlaceholderAPI startup
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: [self-hosted, Linux, X64, resource-heavy]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and build plugin
        run: mvn -B -ntp verify

      - name: Start Paper with PlaceholderAPI and EggEmAll Reloaded
        env:
          PAPER_VERSION: '26.2'
          PAPER_BUILD: '121'
          RUNTIME_VARIANT: 'with-papi'
          EXTRA_PLUGIN_URL: 'https://github.com/PlaceholderAPI/PlaceholderAPI/releases/download/2.12.3/PlaceholderAPI-2.12.3.jar'
          EXTRA_PLUGIN_NAME: 'PlaceholderAPI.jar'
          EXPECT_LOG_PATTERN: 'PlaceholderAPI detected! Registered EggEmAll Reloaded placeholders.'
        run: bash scripts/runtime-smoke.sh
